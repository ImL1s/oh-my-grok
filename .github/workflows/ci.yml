name: ci

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          # Pin static gates — unpinned `ruff` floated 0.15.22 → 0.16.0 and
          # failed CI on style rules unrelated to product changes.
          pip install 'ruff==0.15.22' 'mypy==2.3.0'
      - name: Static parity contracts
        run: |
          python scripts/check_parity_inventory.py --strict
          python scripts/generate_parity_docs.py --check
          python scripts/check_traceability.py
          # check_writer_ownership.py is a release-transaction gate: it diffs the
          # candidate against the frozen release base and requires every changed
          # path to be assigned to a wave owner. That is validated in
          # release.yml (which fetches full history and runs at tag time); it is
          # not a per-commit invariant, so it does not run here.
      - name: Generated artifacts up to date
        run: |
          python scripts/generate_standalone_hook.py --check
          python scripts/generate_capabilities_lock.py --check
          python scripts/check_version_consistency.py --check
          python scripts/generate_antigravity_skill_projections.py --check
      - name: Hermetic unit/integration
        run: python -m pytest -q -m "not live and not tmux_real" --tb=short
      - name: Static Python checks
        # #24: one entrypoint; no hand-picked file lists (see scripts/static_checks.sh).
        run: bash scripts/static_checks.sh
      - name: Smoke + hermetic e2e
        run: ./scripts/smoke.sh
        env:
          OMG_E2E: "1"
          OMG_SMOKE_STRICT: "0"

  # #104: hermetic real-tmux UX regression (fake providers; no grok).
  # These jobs must pass on this PR; whether they are GitHub "required checks"
  # depends on branch protection and is not claimed here.
  team-real-tmux-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install tmux
        run: sudo apt-get update && sudo apt-get install -y tmux
      - name: Prepare artifact dir
        run: mkdir -p /tmp/omg104-artifacts
      - name: Real-tmux UX regression
        run: python -m pytest -q -m tmux_real --tb=short
        env:
          OMG104_ARTIFACT_DIR: /tmp/omg104-artifacts
      - name: Upload tmux failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: team-real-tmux-linux-artifacts
          path: /tmp/omg104-artifacts/
          if-no-files-found: error
          retention-days: 7

  # Early #25 / P3A-25-MACOS-EARLY: one focused macOS job (not a full matrix).
  # Validates OS-sensitive FS/lock/symlink/install contracts on a real host.
  macos-platform:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Single supported version — keep cost bounded.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install tmux (optional transport smoke)
        run: brew install tmux || true
      - name: Platform contracts
        # #25: hermetic HOME/GROK_HOME; script prints uname/ps/git/tmux on fail.
        run: bash scripts/test_platform_contracts.sh
        env:
          HOME: ${{ runner.temp }}/omg-home
          GROK_HOME: ${{ runner.temp }}/omg-grok-home
          # Script picks an available UTF-8 locale (macOS often lacks C.UTF-8).
          GIT_AUTHOR_NAME: omg-platform-ci
          GIT_AUTHOR_EMAIL: omg-platform-ci@example.com
          GIT_COMMITTER_NAME: omg-platform-ci
          GIT_COMMITTER_EMAIL: omg-platform-ci@example.com

  # #104: macOS real-tmux UX (process-group / PTY differs from Linux).
  # Must pass on this PR (branch-protection "required" is optional/admin-owned).
  team-real-tmux-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Install tmux
        run: brew install tmux
      - name: Prepare artifact dir
        run: mkdir -p /tmp/omg104-artifacts
      - name: Real-tmux UX regression
        run: python -m pytest -q -m tmux_real --tb=short
        env:
          OMG104_ARTIFACT_DIR: /tmp/omg104-artifacts
      - name: Upload tmux failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: team-real-tmux-macos-artifacts
          path: /tmp/omg104-artifacts/
          if-no-files-found: error
          retention-days: 7
